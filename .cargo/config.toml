[alias]
# The inner loop: type-check everything (no codegen, no linking).
c = "check --all-targets"
# Lint like CI does.
lint = "clippy --all-targets -- -D warnings"
# Tests through nextest (one process per test, parallel across binaries).
t = "nextest run"

# Hypervisor.framework refuses unsigned callers. Every binary cargo runs (the `emu` CLI and test
# binaries) is ad-hoc signed with the hypervisor entitlement first.
[target.aarch64-apple-darwin]
runner = "scripts/sign-run.sh"

[env]
RUST_BACKTRACE = { value = "short", force = false }
